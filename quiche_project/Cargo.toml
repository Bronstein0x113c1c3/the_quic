cargo-features = ["edition2024"]
[package]
name = "quice_project"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.31"
tokio = { version = "1.44.2", features = ["full"] }
tokio-quicker = { version = "0.0.2", features = ["key-gen"] }
[[bin]]
name = "quic_server"
path = "src/server/quic_server.rs"
[[bin]]
name = "quic_client"
path = "src/client/quic_client.rs"
